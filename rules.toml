# Kollontai v2.1.0 — Regras Táticas (rules.toml)

[rules.KOLLONTAI-001]
name = "CCCPRC-FILE-REQUIRED"
severity = "error"
scope = "project"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-001"
description = "Every repository must have a .cccprc configuration file at the root"
script = '''
if not gost.file_exists(".cccprc") then
    return false, "ERR_CCCPRC_MISSING", {}
end
return true
'''
[rules.KOLLONTAI-001.messages]
ERR_CCCPRC_MISSING = "Configuration file '.cccprc' is missing from repository root"

[rules.KOLLONTAI-002]
name = "PRIMARY-FORGE-TYPE-DECLARED"
severity = "error"
scope = "project"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-002"
description = "The .cccprc configuration file must declare primary_forge_type"
script = '''
if not gost.file_exists(".cccprc") then
    return false, "ERR_CCCPRC_MISSING", {}
end
local content = gost.read_file(".cccprc") or ""
if not content:match("primary_forge_type%s*=") then
    return false, "ERR_PRIMARY_FORGE_TYPE_MISSING", {}
end
return true
'''
[rules.KOLLONTAI-002.messages]
ERR_CCCPRC_MISSING = "Configuration file '.cccprc' is missing"
ERR_PRIMARY_FORGE_TYPE_MISSING = "Property 'primary_forge_type' is not declared in .cccprc"

