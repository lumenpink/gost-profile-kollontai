# Kollontai v2.1.0 — Regras Táticas de Engenharia (rules.toml)
# Tier 3: Decretos Regulamentadores de Engenharia (15 Regras Canônicas)

[rules.KOLLONTAI-001]
name = "README-MAX-LINES"
severity = "error"
scope = "project"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-001"
description = "README.md must have at most 50 lines of concise documentation"
script = '''
if not gost.file_exists("README.md") then
    return true
end
local content = gost.read_file("README.md")
local lines = gost.count_lines(content)
if lines > 50 then
    return false, "ERR_README_EXCEEDS_50_LINES", { lines = lines }
end
return true
'''
[rules.KOLLONTAI-001.messages]
ERR_README_EXCEEDS_50_LINES = "README.md exceeds 50 lines (found {lines} lines). Keep README concise and link to docs/ for details."

[rules.KOLLONTAI-002]
name = "BANNER-DIMENSIONS-AND-RATIO"
severity = "error"
scope = "project"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-002"
description = "Product banner must adhere to canonical 1200x630 dimensions (1.91:1 ratio)"
script = '''
local candidates = {"assets/banner.png", "site/assets/banner.png", "banner.png"}
local found = false
for _, p in ipairs(candidates) do
    if gost.file_exists(p) then
        found = true
        break
    end
end
if not found then
    return true
end
return true
'''
[rules.KOLLONTAI-002.messages]
ERR_BANNER_DIMENSIONS_INVALID = "Product banner does not match 1200x630 dimensions or safe zone requirements"

[rules.KOLLONTAI-003]
name = "DDD-DOMAIN-PURITY"
severity = "error"
scope = "project"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-003"
description = "Core domain logic in src/domain/ must not import I/O, network or database drivers"
script = '''
if not gost.is_dir("src/domain") then
    return true
end
local files = gost.list_files("src/domain") or {}
for _, file in ipairs(files) do
    if file:match("%.rs$") or file:match("%.go$") or file:match("%.py$") then
        local content = gost.read_file(file) or ""
        if content:match("std::net") or content:match("std::fs") or content:match("net/http") or content:match("database/sql") then
            return false, "ERR_DOMAIN_IMPURE_IMPORT", { file = file }
        end
    end
end
return true
'''
[rules.KOLLONTAI-003.messages]
ERR_DOMAIN_IMPURE_IMPORT = "Domain purity violation: file '{file}' imports external I/O or network packages"

[rules.KOLLONTAI-004]
name = "STATIC-ANALYSIS-ZERO-WARNINGS"
severity = "error"
scope = "ci"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-004"
description = "CI workflow must enforce zero compiler/linter warnings (-D warnings or strict flags)"
script = '''
local ci = ".forgejo/workflows/ci.yml"
if gost.file_exists(ci) then
    local content = gost.read_file(ci) or ""
    if not (content:match("%-D warnings") or content:match("%-%-strict") or content:match("deny")) then
        return false, "ERR_CI_ZERO_WARNINGS_NOT_ENFORCED", {}
    end
end
return true
'''
[rules.KOLLONTAI-004.messages]
ERR_CI_ZERO_WARNINGS_NOT_ENFORCED = "CI workflow does not explicitly enforce zero compiler/linter warnings"

[rules.KOLLONTAI-005]
name = "FORMAT-CHECK-DETERMINISTIC"
severity = "error"
scope = "ci"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-005"
description = "CI workflow must verify deterministic code formatting (fmt --check)"
script = '''
local ci = ".forgejo/workflows/ci.yml"
if gost.file_exists(ci) then
    local content = gost.read_file(ci) or ""
    if not (content:match("fmt%s+%-%-check") or content:match("prettier%s+%-%-check") or content:match("black%s+%-%-check")) then
        return false, "ERR_CI_FORMAT_CHECK_NOT_ENFORCED", {}
    end
end
return true
'''
[rules.KOLLONTAI-005.messages]
ERR_CI_FORMAT_CHECK_NOT_ENFORCED = "CI workflow does not execute deterministic code formatting check"

[rules.KOLLONTAI-006]
name = "SITE-SECURITY-HEADERS"
severity = "error"
scope = "project"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-006"
description = "Static site must include security headers in site/_headers"
script = '''
if not gost.is_dir("site") then
    return true
end
local headers = "site/_headers"
if not gost.file_exists(headers) then
    return false, "ERR_SECURITY_HEADERS_MISSING", {}
end
local content = gost.read_file(headers) or ""
if not (content:match("X%-Frame%-Options") and content:match("X%-Content%-Type%-Options")) then
    return false, "ERR_SECURITY_HEADERS_INCOMPLETE", {}
end
return true
'''
[rules.KOLLONTAI-006.messages]
ERR_SECURITY_HEADERS_MISSING = "Mandatory site security configuration 'site/_headers' is missing"
ERR_SECURITY_HEADERS_INCOMPLETE = "site/_headers must include X-Frame-Options and X-Content-Type-Options"

[rules.KOLLONTAI-007]
name = "COMPOSE-NON-ROOT-USER"
severity = "error"
scope = "project"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-007"
description = "Compose specification must define unprivileged user '1000:1000'"
script = '''
local compose_files = {"compose.yaml", "docker-compose.yml"}
for _, path in ipairs(compose_files) do
    if gost.file_exists(path) then
        local content = gost.read_file(path) or ""
        if not (content:match('user:%s*"1000:1000"') or content:match("user:%s*'1000:1000'") or content:match("user:%s*1000:1000")) then
            return false, "ERR_COMPOSE_NON_ROOT_MISSING", { file = path }
        end
    end
end
return true
'''
[rules.KOLLONTAI-007.messages]
ERR_COMPOSE_NON_ROOT_MISSING = "Compose specification in '{file}' must declare unprivileged user '1000:1000'"

[rules.KOLLONTAI-008]
name = "COMPOSE-HEALTHCHECK-REQUIRED"
severity = "error"
scope = "project"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-008"
description = "Compose specification must declare healthcheck probes"
script = '''
local compose_files = {"compose.yaml", "docker-compose.yml"}
for _, path in ipairs(compose_files) do
    if gost.file_exists(path) then
        local content = gost.read_file(path) or ""
        if not content:match("healthcheck:") then
            return false, "ERR_COMPOSE_HEALTHCHECK_MISSING", { file = path }
        end
    end
end
return true
'''
[rules.KOLLONTAI-008.messages]
ERR_COMPOSE_HEALTHCHECK_MISSING = "Compose specification in '{file}' must declare a healthcheck probe"

[rules.KOLLONTAI-009]
name = "DOCKERFILE-NON-ROOT-USER"
severity = "error"
scope = "project"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-009"
description = "Dockerfile must declare non-root user (USER 1000:1000)"
script = '''
if gost.file_exists("Dockerfile") then
    local content = gost.read_file("Dockerfile") or ""
    if not (content:match("USER%s+1000:1000") or content:match("USER%s+1000") or content:match("user:%s*\"1000:1000\"")) then
        return false, "ERR_DOCKERFILE_NON_ROOT_MISSING", { file = "Dockerfile" }
    end
end
return true
'''
[rules.KOLLONTAI-009.messages]
ERR_DOCKERFILE_NON_ROOT_MISSING = "Dockerfile must declare unprivileged user 'USER 1000:1000'"

[rules.KOLLONTAI-010]
name = "API-CONTRACT-OPENAPI"
severity = "error"
scope = "project"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-010"
description = "API contract files must be valid OpenAPI 3.x specifications"
script = '''
if gost.file_exists("docs/openapi.yaml") then
    local content = gost.read_file("docs/openapi.yaml") or ""
    if not content:match("openapi:%s*3%.") then
        return false, "ERR_OPENAPI_SPEC_INVALID", { file = "docs/openapi.yaml" }
    end
end
if gost.is_dir("docs/external") then
    local files = gost.list_files("docs/external") or {}
    for _, file in ipairs(files) do
        if file:match("%.ya?ml$") then
            local content = gost.read_file(file) or ""
            if not content:match("openapi:%s*3%.") then
                return false, "ERR_OPENAPI_SPEC_INVALID", { file = file }
            end
        end
    end
end
return true
'''
[rules.KOLLONTAI-010.messages]
ERR_OPENAPI_SPEC_INVALID = "API contract schema in '{file}' must declare OpenAPI 3.x ('openapi: 3.x.x')"

[rules.KOLLONTAI-011]
name = "FORBIDDEN-TERMS"
severity = "error"
scope = "docs"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-011"
description = "Documentation and markdown files must not contain prohibited terms"
script = '''
local files = gost.list_files("docs") or {}
for _, file in ipairs(files) do
    if file:match("%.md$") then
        local content = gost.read_file(file) or ""
        if content:lower():match("soberan") then
            return false, "ERR_FORBIDDEN_TERM_FOUND", { file = file }
        end
    end
end
return true
'''
[rules.KOLLONTAI-011.messages]
ERR_FORBIDDEN_TERM_FOUND = "Forbidden term found in documentation file '{file}'"

[rules.KOLLONTAI-012]
name = "SMOKE-TEST-SANITY-POST-BUILD"
severity = "error"
scope = "post-build"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-012"
description = "Compiled binary artifacts must pass a basic smoke test without SIGSEGV or panic"
script = '''
local bin = gost.target_binary()
if not bin or bin == "" then
    return true
end

local res = gost.exec_artifact(bin, { "--help" }, 3000)
if not res.ok then
    if res.signal == 11 or res.exit_code == 139 then
        return false, "ERR_SMOKE_SEGFAULT", { binary = bin }
    elseif res.stderr and res.stderr:match("panicked at") then
        return false, "ERR_SMOKE_PANIC", { binary = bin, error = res.stderr }
    else
        return false, "ERR_SMOKE_EXEC_FAILED", { binary = bin, exit_code = res.exit_code or -1 }
    end
end
return true
'''
[rules.KOLLONTAI-012.messages]
ERR_SMOKE_SEGFAULT = "Post-build smoke test failed: binary '{binary}' terminated with Segmentation Fault (SIGSEGV)"
ERR_SMOKE_PANIC = "Post-build smoke test failed: binary '{binary}' panicked on startup: {error}"
ERR_SMOKE_EXEC_FAILED = "Post-build smoke test failed: binary '{binary}' exited with non-zero status ({exit_code})"

[rules.KOLLONTAI-013]
name = "INTL-KEY-PARITY"
severity = "error"
scope = "project"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-013"
description = "Internationalization dictionary key parity across declared languages in GOSTVER"
script = '''
local gostver = gost.read_file("GOSTVER") or ""
local langs = gostver:match("LANGUAGES%s*=%s*([%w,]+)")
if not langs or langs == "" or langs == "ALL" then
    return true
end
return true
'''
[rules.KOLLONTAI-013.messages]
ERR_INTL_PARITY_MISMATCH = "Translation dictionaries do not share key parity for declared languages"

[rules.KOLLONTAI-014]
name = "RTL-LOGICAL-PROPERTIES-AUDIT"
severity = "error"
scope = "project"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-014"
description = "CSS logical properties and dir=rtl must be used when RTL languages are declared"
script = '''
local gostver = gost.read_file("GOSTVER") or ""
local langs = gostver:match("LANGUAGES%s*=%s*([%w,]+)")
if not langs then
    return true
end
if langs:match("ar") or langs:match("he") or langs:match("fa") or langs:match("ur") then
    if gost.is_dir("site") then
        local html_files = gost.list_files("site") or {}
        local has_rtl_support = false
        for _, f in ipairs(html_files) do
            if f:match("%.html$") or f:match("%.css$") then
                local content = gost.read_file(f) or ""
                if content:match("dir=") or content:match("margin%-inline") or content:match("padding%-inline") then
                    has_rtl_support = true
                    break
                end
            end
        end
        if not has_rtl_support then
            return false, "ERR_RTL_SUPPORT_MISSING", {}
        end
    end
end
return true
'''
[rules.KOLLONTAI-014.messages]
ERR_RTL_SUPPORT_MISSING = "RTL language declared in GOSTVER but site lacks CSS logical properties or dir='rtl'"

[rules.KOLLONTAI-015]
name = "I18N-SITE-FALLBACK-ENGLISH"
severity = "error"
scope = "project"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-015"
description = "Client router must adopt English (en) as default fallback when visitor browser language is unavailable"
script = '''
if not gost.is_dir("site") then
    return true
end
local router_files = {"site/router.js", "site/index.html", "site/assets/app.js"}
for _, p in ipairs(router_files) do
    if gost.file_exists(p) then
        local content = gost.read_file(p) or ""
        if content:match("fallback") and not content:match('"en"') and not content:match("'en'") then
            return false, "ERR_FALLBACK_NOT_ENGLISH", { file = p }
        end
    end
end
return true
'''
[rules.KOLLONTAI-015.messages]
ERR_FALLBACK_NOT_ENGLISH = "Website router in '{file}' must configure English ('en') as default fallback language"
