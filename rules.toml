[rules.KOLLONTAI-004]
name = "FORBIDDEN-TERMS-PROHIBITED"
severity = "error"
scope = "docs"
docs_url = "https://kollontai.2lp.in/2.1.0/rules/KOLLONTAI-004"
description = "Documentation files must not contain prohibited imperialist terms"
script = '''
local files = gost.list_files("docs") or {}
for _, file in ipairs(files) do
    if file:match("%.md$") then
        local content = gost.read_file(file) or ""
        if content:lower():match("soberan") then
            return false, "ERR_FORBIDDEN_TERM_FOUND", { file = file }
        end
    end
end
return true
'''
[rules.KOLLONTAI-004.messages]
ERR_FORBIDDEN_TERM_FOUND = "Forbidden imperialist term found in documentation file '{file}'"

