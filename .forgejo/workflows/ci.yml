name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: "Validate Specification & Site"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Run Normative Spec Audits & Tests"
        run: |
          for test_script in tests/*.sh; do
            echo "Running $test_script..."
            bash "$test_script"
          done

      - name: "Run CCCP Conformance Gate"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp check --strict
          fi
          echo "All normative technical specifications and tests passed."

  deploy-site:
    name: "Deploy Documentation Site (kollontai.2lp.in)"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: "Deploy to Cloudflare Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Publishing static documentation site to kollontai.2lp.in via Cloudflare Workers..."
            npx wrangler deploy
          else
            echo "::warning::Cloudflare credentials (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) not configured. Skipping Cloudflare deployment."
          fi
