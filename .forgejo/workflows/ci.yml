name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: "Validate Specification & Site"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Verify Essential Files"
        run: |
          test -f profile.md || { echo "profile.md missing"; exit 1; }
          test -f GOSTVER || { echo "GOSTVER missing"; exit 1; }
          test -f README.md || { echo "README.md missing"; exit 1; }
          test -f LICENSE || { echo "LICENSE missing"; exit 1; }
          test -f VERSION || { echo "VERSION missing"; exit 1; }
          test -f site/index.html || { echo "site/index.html missing"; exit 1; }
          test -f site/profile.md || { echo "site/profile.md missing"; exit 1; }
          test -f site/_headers || { echo "site/_headers missing"; exit 1; }
          echo "All essential Kollontai profile files are present."

  deploy-site:
    name: "Deploy Documentation Site"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: "Deploy to Cloudflare Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler deploy
          else
            echo "CLOUDFLARE_API_TOKEN not set, skipping Cloudflare deploy."
          fi
      - name: "Deploy to Codeberg Pages (Stateless Orphan Force Push)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "actions-user"
          git config user.email "actions@codeberg.org"
          WORKTREE_DIR=$(mktemp -d)
          git worktree add --orphan -b pages "$WORKTREE_DIR"
          rm -rf "${WORKTREE_DIR:?}"/*
          cp -r site/* "$WORKTREE_DIR/"
          cd "$WORKTREE_DIR"
          git add -A
          if git diff --staged --quiet; then
            echo "No site changes to deploy."
          else
            git commit -m "docs(site): deploy documentation snapshot [skip ci]"
            git push --force origin pages
          fi
          cd - >/dev/null
          git worktree remove "$WORKTREE_DIR" --force || true
