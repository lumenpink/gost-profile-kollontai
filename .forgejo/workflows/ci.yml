name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: "Validate Specification & Site"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Format & Hygiene Check"
        run: |
          if command -v black >/dev/null 2>&1; then
            black --check scripts/
          fi

      - name: "Run Normative Spec Audits & Tests"
        run: |
          for test_script in tests/*.sh; do
            echo "Running $test_script..."
            bash "$test_script"
          done

      - name: "Run CCCP Conformance Gate"
        run: |
          if command -v cccp >/dev/null 2>&1; then
            cccp hook -i || true
            cccp check --strict
          fi
          echo "All normative technical specifications and tests passed."

  deploy-site:
    name: "Publish Site Bundle to Generic Packages (kollontai.2lp.in)"
    runs-on: ubuntu-latest
    container:
      image: gambi.2lp.in/lumen/gost-ci-shell:latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: "Upload Site Bundle for Kombinat"
        env:
          GAMBI_2LP_IN_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GAMBI_2LP_IN_TOKEN || secrets.FORGEJO_TOKEN || secrets.GIT_2LP_TOKEN }}
        run: |
          cccp package upload site

