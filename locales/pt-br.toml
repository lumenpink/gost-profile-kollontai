# Kollontai v2.1.0 — Catálogo de Tradução das Regras Táticas (pt-BR)

[rules.KOLLONTAI-001]
description = "O arquivo README.md deve ter no máximo 50 linhas de documentação concisa"
[rules.KOLLONTAI-001.messages]
ERR_README_EXCEEDS_50_LINES = "README.md ultrapassa o teto de 50 linhas (encontradas {lines} linhas). Mantenha o README conciso e direcione detalhes para docs/."

[rules.KOLLONTAI-002]
description = "O banner institucional do produto deve respeitar as dimensões canônicas de 1200x630 (proporção 1.91:1)"
[rules.KOLLONTAI-002.messages]
ERR_BANNER_DIMENSIONS_INVALID = "O banner do produto não atende às dimensões canônicas de 1200x630 ou safe zone"

[rules.KOLLONTAI-003]
description = "Pureza de domínio: o núcleo em src/domain/ não deve importar I/O, rede ou bibliotecas de banco de dados"
[rules.KOLLONTAI-003.messages]
ERR_DOMAIN_IMPURE_IMPORT = "Violação de pureza de domínio: o arquivo '{file}' importa módulos externos de I/O ou rede"

[rules.KOLLONTAI-004]
description = "A esteira de integração contínua deve exigir zero avisos de compilação/linter (-D warnings ou flags estritas)"
[rules.KOLLONTAI-004.messages]
ERR_CI_ZERO_WARNINGS_NOT_ENFORCED = "A esteira de CI não impõe explicitamente tolerância zero a avisos de compilação/linter"

[rules.KOLLONTAI-005]
description = "A esteira de CI deve validar a formatação determinística de código (fmt --check)"
[rules.KOLLONTAI-005.messages]
ERR_CI_FORMAT_CHECK_NOT_ENFORCED = "A esteira de CI não executa a verificação determinística de formatação de código"

[rules.KOLLONTAI-006]
description = "O site estático deve incluir cabeçalhos HTTP de segurança em site/_headers"
[rules.KOLLONTAI-006.messages]
ERR_SECURITY_HEADERS_MISSING = "Configuração obrigatória de segurança 'site/_headers' não encontrada"
ERR_SECURITY_HEADERS_INCOMPLETE = "O arquivo site/_headers deve conter X-Frame-Options e X-Content-Type-Options"

[rules.KOLLONTAI-007]
description = "Manifestos compose devem declarar usuário desprivilegiado '1000:1000'"
[rules.KOLLONTAI-007.messages]
ERR_COMPOSE_NON_ROOT_MISSING = "A especificação compose em '{file}' deve declarar usuário desprivilegiado '1000:1000'"

[rules.KOLLONTAI-008]
description = "Manifestos compose devem declarar sondas de integridade ativas (healthcheck)"
[rules.KOLLONTAI-008.messages]
ERR_COMPOSE_HEALTHCHECK_MISSING = "A especificação compose em '{file}' deve declarar uma sonda de healthcheck"

[rules.KOLLONTAI-009]
description = "Arquivos Dockerfile devem declarar usuário não-root (USER 1000:1000)"
[rules.KOLLONTAI-009.messages]
ERR_DOCKERFILE_NON_ROOT_MISSING = "O Dockerfile deve declarar usuário desprivilegiado 'USER 1000:1000'"

[rules.KOLLONTAI-010]
description = "Contratos de API devem ser especificações válidas no padrão OpenAPI 3.x"
[rules.KOLLONTAI-010.messages]
ERR_OPENAPI_SPEC_INVALID = "O contrato de API em '{file}' deve declarar conformidade com OpenAPI 3.x ('openapi: 3.x.x')"

[rules.KOLLONTAI-011]
description = "Arquivos de documentação e markdown não devem conter termos proibidos"
[rules.KOLLONTAI-011.messages]
ERR_FORBIDDEN_TERM_FOUND = "Termo proibido encontrado no arquivo de documentação '{file}'"

[rules.KOLLONTAI-012]
description = "Binários compilados devem passar por smoke test básico de sanidade sem falha de segmentação ou pânico"
[rules.KOLLONTAI-012.messages]
ERR_SMOKE_SEGFAULT = "Falha no smoke test pós-compilação: binário '{binary}' abortou com Falha de Segmentação (SIGSEGV)"
ERR_SMOKE_PANIC = "Falha no smoke test pós-compilação: binário '{binary}' entrou em pânico na inicialização: {error}"
ERR_SMOKE_EXEC_FAILED = "Falha no smoke test pós-compilação: binário '{binary}' encerrou com status não-zero ({exit_code})"

[rules.KOLLONTAI-013]
description = "Paridade de chaves nos dicionários de internacionalização entre as línguas declaradas em GOSTVER"
[rules.KOLLONTAI-013.messages]
ERR_INTL_PARITY_MISMATCH = "Dicionários de tradução não compartilham paridade de chaves para as línguas declaradas"

[rules.KOLLONTAI-014]
description = "Propriedades lógicas CSS e atributo dir=rtl devem ser adotados quando idiomas RTL forem declarados"
[rules.KOLLONTAI-014.messages]
ERR_RTL_SUPPORT_MISSING = "Idioma RTL declarado no GOSTVER mas o site não adota propriedades lógicas CSS ou dir='rtl'"

[rules.KOLLONTAI-015]
description = "O roteador do site deve adotar inglês (en) como fallback padrão quando o idioma do visitante não estiver disponível"
[rules.KOLLONTAI-015.messages]
ERR_FALLBACK_NOT_ENGLISH = "O roteador do site em '{file}' deve configurar inglês ('en') como idioma padrão de fallback"

[rules.KOLLONTAI-016]
description = "Manifestos de pacotes não devem conter dependências apontando para caminhos do sistema de arquivos local"
[rules.KOLLONTAI-016.messages]
ERR_PATH_DEPENDENCY_FORBIDDEN = "Dependência local via caminho do sistema de arquivos detectada no manifesto '{file}'. Utilize registros canônicos de pacotes."
